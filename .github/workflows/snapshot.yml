name: Снимок цен

# Ежедневно в 07:00 по Симферополю (MSK = UTC+3). Крон в Actions идёт по UTC
# и под нагрузкой может опоздать на десятки минут — для снимка цен это неважно.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:        # кнопка «запустить сейчас» в интерфейсе

permissions:
  contents: write           # workflow коммитит снимок обратно в репозиторий

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20     # обычный прогон — меньше минуты; отсечка от зависаний
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Снять цены
        run: python snapshot_prices.py

      - name: Закоммитить снимок
        run: |
          day=$(date -u -d '+3 hours' +%F)
          file="output/snapshots/$day.parquet"
          if [ ! -f "$file" ]; then
            echo "::error::снимок $file не создан"
            exit 1
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git diff --cached --quiet && echo "снимок за $day уже в репозитории" && exit 0
          git commit -m "data: снимок цен $day"
          git push
