name: Полный пищевой срез

# Основной прогон — ночь с воскресенья на понедельник, 03:00 по Симферополю.
# Снимок цен ежедневный и дешёвый, но он идёт по листингам, а там нет ни
# состава, ни КБЖУ, ни товаров, которых сейчас нет в наличии. За этим нужен
# обход карточек — он долгий (около 20 минут), потому и еженедельный.
#
# Категория, упавшая от временного сбоя API, обходится вторым проходом
# внутри самого скрипта (parse_all_categories.py). Если и это не помогло —
# недособранная папка сохраняется кэшем Actions и подхватывается двумя
# страховочными прогонами позже в тот же день и следующим утром: скрипт
# возобновляемый и сам пропускает уже готовые категории, поэтому досбор
# трогает только то, что не собралось, а если всё уже готово — проверяет
# это за секунды и ничего не тратит.
on:
  schedule:
    - cron: '0 0 * * 1'   # понедельник 03:00 MSK — основной прогон
    - cron: '0 8 * * 1'   # понедельник 11:00 MSK — досбор №1
    - cron: '0 0 * * 2'   # вторник 03:00 MSK — досбор №2, последняя попытка на неделе
  workflow_dispatch:

permissions:
  contents: write   # публикует данные сайта в gh-pages

concurrency:
  group: weekly-full
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ключ недели
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Ключ включает run_id, поэтому точного совпадения не бывает — он
      # нужен только для восстановления по restore-keys: подхватывает
      # последнюю сохранённую папку этой недели, если она есть.
      - name: Восстановить незавершённый прогон этой недели
        uses: actions/cache/restore@v4
        with:
          path: output/food-*
          key: food-${{ steps.week.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            food-${{ steps.week.outputs.key }}-

      - name: Обойти пищевые категории
        run: python parse_food_categories.py

      - name: Сохранить прогресс на случай досбора
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/food-*
          key: food-${{ steps.week.outputs.key }}-${{ github.run_id }}

      - name: Экспорт в Parquet
        run: |
          dir=$(ls -d output/food-????-??-?? | sort | tail -1)
          python export_parquet.py "$dir"

      - name: Собрать данные сайта
        run: python build_site_data.py

      # Артефакт — для быстрой проверки текущего прогона прямо в интерфейсе
      # Actions; хранится всего 30 дней, поэтому не единственная копия.
      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: web/data/
          retention-days: 30

      # Постоянное хранение — тот же приём, что и в update_daily.ps1: ветка
      # gh-pages целиком из web/, перезаписывается force-push'ем, история
      # не растёт. В отличие от артефакта не истекает через 30 дней.
      - name: Опубликовать данные сайта в gh-pages
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git --work-tree=web add --all
          tree=$(git --work-tree=web write-tree)
          git read-tree HEAD
          commit=$(git commit-tree "$tree" -m "site data $(date -u +%F)")
          git update-ref refs/heads/gh-pages "$commit"
          git push -f origin gh-pages
